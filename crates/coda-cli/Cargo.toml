[package]
name = "coda-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "coda_cli"
path = "src/lib.rs"

[[bin]]
name = "coda"
path = "src/main.rs"

[dependencies]
clap.workspace = true
coda-client = { path = "../coda-client" }
coda-config = { path = "../coda-config" }
coda-core = { path = "../coda-core" }
coda-daemon = { path = "../coda-daemon" }
coda-protocol = { path = "../coda-protocol" }
coda-providers = { path = "../coda-providers" }
coda-store = { path = "../coda-store" }
coda-telemetry = { path = "../coda-telemetry" }
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["signal"] }
tracing.workspace = true

[dev-dependencies]
coda-testkit = { path = "../coda-testkit" }

[lints]
workspace = true
