[package]
name = "coda-tui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
coda-agents = { path = "../coda-agents" }
coda-client = { path = "../coda-client" }
coda-config = { path = "../coda-config" }
coda-protocol = { path = "../coda-protocol" }
crossterm = { version = "=0.29.0", default-features = false, features = ["events", "bracketed-paste"] }
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["signal"] }
tracing.workspace = true
tracing-subscriber.workspace = true
unicode-segmentation = "=1.13.3"
unicode-width = "=0.2.2"

[dev-dependencies]
coda-daemon = { path = "../coda-daemon" }
coda-store = { path = "../coda-store" }
coda-testkit = { path = "../coda-testkit" }
rustix = { workspace = true, features = ["process", "pty", "termios"] }
tempfile.workspace = true

[lints]
workspace = true
