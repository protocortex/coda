[package]
name = "coda-providers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
# Shared provider contract suite, for provider crates to run in their tests.
testing = []

[dependencies]
coda-config = { path = "../coda-config" }
coda-protocol = { path = "../coda-protocol" }
coda-tools = { path = "../coda-tools" }
httpdate.workspace = true
reqwest.workspace = true
rustix = { workspace = true, features = ["process"] }
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["process"] }
tracing.workspace = true

[dev-dependencies]
coda-providers = { path = ".", features = ["testing"] }
coda-testkit = { path = "../coda-testkit" }
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
